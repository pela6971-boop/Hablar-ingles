<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hablar Inglés</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f5f9;
  margin: 0;
  padding: 20px;
  text-align: center;
}

h1 {
  font-size: 32px;
  margin-bottom: 5px;
}

.subtitulo {
  font-size: 18px;
  color: #555;
}

.caja {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin: 25px auto;
  max-width: 500px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

#texto,
#respuesta {
  font-size: 21px;
  min-height: 70px;
  padding: 15px;
}

button {
  border: none;
  border-radius: 50%;
  width: 110px;
  height: 110px;
  font-size: 45px;
  background: #2563eb;
  color: white;
}

button:active {
  transform: scale(0.95);
}

#estado {
  margin-top: 20px;
  font-size: 18px;
  font-weight: bold;
}

.nuevo {
  margin-top: 20px;
  border-radius: 12px;
  width: auto;
  height: auto;
  padding: 12px 20px;
  font-size: 16px;
  background: #222;
}
</style>
</head>

<body>

<h1>🇬🇧 Hablar Inglés</h1>

<p class="subtitulo">
Practica inglés hablando conmigo
</p>

<div class="caja">

  <h2>Tu frase</h2>

  <div id="texto">
    Pulsa 🎤 y habla en inglés
  </div>

  <button onclick="hablar()">🎤</button>

  <div id="estado"></div>

</div>

<div class="caja">

  <h2>Mi pregunta</h2>

  <div id="respuesta">
    Hello! Let's practice English.
  </div>

</div>

<button class="nuevo" onclick="nuevaConversacion()">
Nueva conversación
</button>

<script>

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

const reconocimiento = new SpeechRecognition();

reconocimiento.lang = "en-US";
reconocimiento.continuous = false;
reconocimiento.interimResults = false;


/* PREGUNTAS PARA PRACTICAR */

const preguntas = [

  "What did you do today?",

  "What is your favorite food?",

  "Where do you live?",

  "What do you like to do in your free time?",

  "What is your favorite movie?",

  "Do you like traveling?",

  "Where would you like to travel?",

  "What did you do last weekend?",

  "What is your favorite day of the week?",

  "Tell me about your family.",

  "What kind of music do you like?",

  "What is your favorite season?",

  "What do you usually do in the morning?",

  "What is your favorite place?",

  "What are you going to do tomorrow?",

  "Do you like cooking?",

  "What is your favorite animal?",

  "What job would you like to have?",

  "What makes you happy?",

  "What are your plans for this weekend?"

];


/* ELEGIR UNA PREGUNTA ALEATORIA */

function preguntaAleatoria() {

  const indice =
    Math.floor(Math.random() * preguntas.length);

  return preguntas[indice];

}


/* CUANDO EMPIEZA A ESCUCHAR */

reconocimiento.onstart = function() {

  document.getElementById("estado").textContent =
    "🎤 I'm listening...";

};


/* CUANDO TERMINA DE ESCUCHAR */

reconocimiento.onresult = function(event) {

  const texto =
    event.results[0][0].transcript;

  document.getElementById("texto").textContent =
    texto;

  document.getElementById("estado").textContent =
    "✅ Good job!";

  responder();

};


/* SI HAY UN ERROR */

reconocimiento.onerror = function() {

  document.getElementById("estado").textContent =
    "❌ I couldn't hear you. Try again.";

};


/* ACTIVAR MICRÓFONO */

function hablar() {

  reconocimiento.start();

}


/* HACER UNA PREGUNTA NUEVA */

function responder() {

  const pregunta =
    preguntaAleatoria();

  document.getElementById("respuesta").textContent =
    pregunta;

  const voz =
    new SpeechSynthesisUtterance(pregunta);

  voz.lang = "en-US";
  voz.rate = 0.9;

  speechSynthesis.cancel();

  speechSynthesis.speak(voz);

}


/* NUEVA CONVERSACIÓN */

function nuevaConversacion() {

  document.getElementById("texto").textContent =
    "Pulsa 🎤 y habla en inglés";

  document.getElementById("estado").textContent =
    "";

  responder();

}

</script>

</body>
</html>
