<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hablar Inglés</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f5f9;
  margin: 0;
  padding: 20px;
  text-align: center;
}

h1 {
  font-size: 32px;
  margin-bottom: 5px;
}

.subtitulo {
  font-size: 18px;
  color: #555;
}

.caja {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin: 25px auto;
  max-width: 500px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

#texto {
  font-size: 21px;
  min-height: 70px;
  padding: 15px;
}

#respuesta {
  font-size: 21px;
  min-height: 60px;
  padding: 15px;
}

button {
  border: none;
  border-radius: 50%;
  width: 110px;
  height: 110px;
  font-size: 45px;
  background: #2563eb;
  color: white;
  cursor: pointer;
}

button:active {
  transform: scale(0.95);
}

#estado {
  margin-top: 20px;
  font-size: 18px;
  font-weight: bold;
}

.nuevo {
  margin-top: 20px;
  border-radius: 12px;
  width: auto;
  height: auto;
  padding: 12px 20px;
  font-size: 16px;
  background: #222;
}
</style>
</head>

<body>

<h1>🇬🇧 Hablar Inglés</h1>

<p class="subtitulo">
Practica inglés hablando conmigo
</p>

<div class="caja">

  <h2>Tu frase</h2>

  <div id="texto">
    Pulsa 🎤 y habla en inglés
  </div>

  <button onclick="hablar()">🎤</button>

  <div id="estado"></div>

</div>

<div class="caja">

  <h2>Mi respuesta</h2>

  <div id="respuesta">
    Hello! Nice to meet you.
  </div>

</div>

<button class="nuevo" onclick="nuevaConversacion()">
Nueva conversación
</button>

<script>

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

const reconocimiento = new SpeechRecognition();

reconocimiento.lang = "en-US";
reconocimiento.continuous = false;
reconocimiento.interimResults = false;

let respuestas = [
  "Very good! How are you today?",
  "That's great! Tell me more about yourself.",
  "Interesting! What do you like to do in your free time?",
  "Very nice! Where are you from?",
  "Good job! What did you do today?",
  "Excellent! Tell me about your family.",
  "That's interesting. What is your favorite food?",
  "Very good! Do you like traveling?"
];

reconocimiento.onstart = function() {

  document.getElementById("estado").textContent =
    "🎤 I'm listening...";

};

reconocimiento.onresult = function(event) {

  const texto =
    event.results[0][0].transcript;

  document.getElementById("texto").textContent =
    texto;

  document.getElementById("estado").textContent =
    "✅ Good job!";

  responder();

};

reconocimiento.onerror = function() {

  document.getElementById("estado").textContent =
    "❌ I couldn't hear you. Try again.";

};

function hablar() {

  reconocimiento.start();

}

function responder() {

  const indice =
    Math.floor(Math.random() * respuestas.length);

  const textoRespuesta =
    respuestas[indice];

  document.getElementById("respuesta").textContent =
    textoRespuesta;

  const voz =
    new SpeechSynthesisUtterance(textoRespuesta);

  voz.lang = "en-US";
  voz.rate = 0.9;

  speechSynthesis.cancel();
  speechSynthesis.speak(voz);

}

function nuevaConversacion() {

  document.getElementById("texto").textContent =
    "Pulsa 🎤 y habla en inglés";

  document.getElementById("respuesta").textContent =
    "Hello! Let's practice English.";

  document.getElementById("estado").textContent =
    "";

  const voz =
    new SpeechSynthesisUtterance(
      "Hello! Let's practice English."
    );

  voz.lang = "en-US";
  voz.rate = 0.9;

  speechSynthesis.speak(voz);

}

</script>

</body>
</html>
